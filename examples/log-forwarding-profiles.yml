---
# Example log forwarding profile configurations
# This file demonstrates various log forwarding profile setups for different
# use cases

log_forwarding_profiles:
  # Basic traffic logging to Panorama
  - name: basic-traffic-forwarding
    folder: Texas
    description: Basic traffic log forwarding to Panorama
    enhanced_application_logging: false
    match_list:
      - name: all-traffic
        log_type: traffic
        filter: All Logs
        send_to_panorama: true

  # Forward to syslog
  - name: syslog-forwarding
    folder: Texas
    description: Forward logs to syslog servers
    enhanced_application_logging: false
    match_list:
      - name: traffic-to-syslog
        log_type: traffic
        filter: All Logs
        send_syslog:
          - secure-syslog-profile
      - name: threats-to-syslog
        log_type: threat
        filter: All Logs
        send_syslog:
          - secure-syslog-profile

  # Compliance logging
  - name: compliance-logging
    folder: Texas
    description: Compliance-focused logging
    enhanced_application_logging: true
    match_list:
      - name: compliance-traffic
        log_type: traffic
        filter: All Logs
        send_to_panorama: true
        send_syslog:
          - compliance-logging-profile
      - name: compliance-auth
        log_type: auth
        filter: All Logs
        send_syslog:
          - compliance-logging-profile

  # Cloud logging
  - name: cloud-integration
    folder: Texas
    description: Cloud platform logging
    enhanced_application_logging: true
    match_list:
      - name: cloud-traffic
        log_type: traffic
        filter: All Logs
        send_syslog:
          - cloud-logging-profile
      - name: cloud-threats
        log_type: threat
        filter: All Logs
        send_syslog:
          - cloud-logging-profile

  # Security monitoring
  - name: security-monitoring
    folder: Texas
    description: Security event monitoring
    enhanced_application_logging: true
    match_list:
      - name: high-severity-threats
        log_type: threat
        filter: (severity eq critical) or (severity eq high)
        send_to_panorama: true
        send_syslog:
          - secure-syslog-profile
      - name: auth-failures
        log_type: auth
        filter: All Logs
        send_to_panorama: true

  # URL filtering logs
  - name: url-filtering-logs
    folder: Texas
    description: URL filtering event logging
    enhanced_application_logging: false
    match_list:
      - name: blocked-urls
        log_type: url
        filter: All Logs
        send_to_panorama: true
        quarantine: true

  # WildFire malware logs
  - name: wildfire-logging
    folder: Texas
    description: WildFire malware analysis logging
    enhanced_application_logging: true
    match_list:
      - name: wildfire-events
        log_type: wildfire
        filter: All Logs
        send_to_panorama: true

  # VPN tunnel monitoring
  - name: tunnel-monitoring
    folder: Texas
    description: VPN tunnel monitoring
    enhanced_application_logging: false
    match_list:
      - name: tunnel-events
        log_type: tunnel
        filter: All Logs
        send_to_panorama: true

  # Decryption logging
  - name: decryption-logging
    folder: Texas
    description: SSL/TLS decryption logging
    enhanced_application_logging: false
    match_list:
      - name: decryption-events
        log_type: decryption
        filter: All Logs
        send_to_panorama: true

  # DNS security logging
  - name: dns-security
    folder: Texas
    description: DNS security threat logging
    enhanced_application_logging: true
    match_list:
      - name: dns-threats
        log_type: dns-security
        filter: All Logs
        send_to_panorama: true
        quarantine: true
