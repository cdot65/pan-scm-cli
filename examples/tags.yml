# Example tags for Palo Alto Networks Strata Cloud Manager
# Tags are used to label and categorize configuration objects for easier management
# Each tag can have a name, color, and optional comments

tags:
  # Environment tags
  - name: Production
    folder: Texas
    color: Red
    comments: Production environment - handle with care

  - name: Development
    folder: Texas
    color: Green
    comments: Development environment - safe for testing

  - name: Staging
    folder: Texas
    color: Yellow
    comments: Staging environment - pre-production testing

  # Priority tags
  - name: Critical
    folder: Texas
    color: Red-Orange
    comments: Critical infrastructure components

  - name: High-Priority
    folder: Texas
    color: Orange
    comments: High priority resources

  - name: Low-Priority
    folder: Texas
    color: Gray
    comments: Low priority resources

  # Department tags
