# Service Group Configuration Example
# This file demonstrates various service group configurations.
# Service groups organize related services for use in security policies.

service_groups:
  # Web services group
  - name: "web-services"
    folder: "Texas"
    members:
      - "service-http"
      - "service-https"
      - "web-browsing"
      - "ssl"
      - "custom-web"
    tag:
      - "web"
      - "standard"

  # Database services group
  - name: "database-services"
    folder: "Texas"
    members:
      - "mysql-cluster"
      - "ms-sql-db"
      - "oracle-db"
      - "postgresql"
      - "mongodb"

  # Email services group
  - name: "email-services"
    folder: "Texas"
    members:
      - "smtp"
      - "pop3"
      - "imap"
      - "email-services"
    tag:
      - "email"
      - "communication"

  # Infrastructure management services
  - name: "infrastructure-mgmt"
    folder: "Texas"
    members:
      - "ssh"
      - "ssh-custom"
      - "telnet"
      - "snmp"
      - "snmp-trap"
      - "syslog"
      - "ntp"
    tag:
      - "infrastructure"
      - "management"

  # File transfer services
  - name: "file-transfer-services"
    folder: "Texas"
    members:
      - "ftp"
      - "ftp-data-transfer"
      - "tftp"
      - "sftp"
      - "scp"
    tag:
      - "file-transfer"

  # VoIP and communication services
  - name: "voip-services"
    folder: "Texas"
    members:
      - "sip"
      - "sip-voip"
      - "h323"
      - "rtp"
      - "rtcp"
    tag:
      - "voip"
      - "real-time"
      - "communication"

  # Development and API services
  - name: "dev-api-services"
    folder: "Texas"
    members:
      - "custom-app-api"
      - "rest-api"
      - "graphql"
      - "grpc"
    tag:
      - "api"
      - "development"

  # Gaming services
  - name: "gaming-services"
    folder: "Texas"
    members:
      - "game-server"
      - "steam"
      - "xbox-live"
      - "playstation-network"
    tag:
      - "gaming"
      - "entertainment"

  # Monitoring and health check services
  - name: "monitoring-services"
    folder: "Texas"
    members:
      - "health-check"
      - "ping"
      - "traceroute"
      - "prometheus"
      - "grafana"
    tag:
      - "monitoring"
      - "observability"

  # Nested service groups example
  - name: "all-critical-services"
    folder: "Texas"
    members:
      - "database-services"      # Reference to another service group
      - "infrastructure-mgmt"    # Reference to another service group
      - "monitoring-services"    # Reference to another service group
      - "dns"                    # Direct service reference
      - "ntp"                    # Direct service reference
    tag:
      - "critical"
      - "production"