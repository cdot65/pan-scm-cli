# Service Group Configuration Example
# This file demonstrates various service group configurations.
# Service groups organize related services for use in security policies.

service_groups:
  # Web services group
  - name: web-services
    folder: Texas
    members:
      - web-browsing
      - custom-app-api
    tag:
      - Web-Service
      - Production

  # Database services group
  - name: database-services
    folder: Texas
    members:
      - mysql-cluster

  # Email and communication services
  - name: communication-services
    folder: Texas
    members:
      - email-services
      - sip-voip
    tag:
      - Application
      - Critical

  # Infrastructure management services
  - name: infrastructure-mgmt
    folder: Texas
    members:
      - ssh-custom
      - dns
      - health-check
    tag:
      - Infrastructure
      - Critical

  # File transfer services
  - name: file-transfer-services
    folder: Texas
    members:
      - ftp-data-transfer
    tag:
      - Legacy

  # Gaming services
  - name: gaming-services
    folder: Texas
    members:
      - game-server
    tag:
      - Application
      - Low-Priority

  # Monitoring services
  - name: monitoring-services
    folder: Texas
    members:
      - health-check
    tag:
      - Monitor
      - Infrastructure

  # Critical services group (nested example)
  - name: critical-services
    folder: Texas
    members:
      - database-services      # Reference to another service group
      - infrastructure-mgmt    # Reference to another service group
      - dns                    # Direct service reference
    tag:
      - Critical
      - Production

  # All services group
  - name: all-services
    folder: Texas
    members:
      - web-services           # Nested group
      - database-services      # Nested group
      - communication-services # Nested group
      - infrastructure-mgmt    # Nested group
      - file-transfer-services # Nested group
      - gaming-services        # Nested group

  # Production services only
  - name: production-services
    folder: Texas
    members:
      - web-browsing
      - mysql-cluster
      - email-services
      - dns
      - custom-app-api
    tag:
      - Production