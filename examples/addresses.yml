# Example address objects for different folders
addresses:
  # Austin folder examples
  - name: austin-web-server
    ip_netmask: 10.1.1.10/32
    description: "Austin office web server"
    folder: Austin
    tags:
      - web
      - austin

  - name: austin-db-server
    ip_netmask: 10.1.2.20/32
    description: "Austin office database server"
    folder: Austin
    tags:
      - database
      - austin

  - name: austin-app-range
    ip_range: 10.1.3.1-10.1.3.10
    description: "Austin application server range"
    folder: Austin
    tags:
      - application
      - austin

  # Texas folder examples
  - name: texas-mail-server
    fqdn: mail.texas.example.com
    description: "Texas mail server FQDN"
    folder: Texas
    tags:
      - email
      - texas

  - name: texas-branch-network
    ip_netmask: 172.16.0.0/24
    description: "Texas branch office network"
    folder: Texas
    tags:
      - branch
      - network

  - name: texas-wildcard-subnet
    ip_wildcard: 10.20.0.0/0.0.255.255
    description: "Texas wildcard subnet match"
    folder: Texas
    tags:
      - wildcard
      - texas

  # ngfw-shared folder examples
  - name: google-dns-primary
    ip_netmask: 8.8.8.8/32
    description: "Google Primary DNS"
    folder: ngfw-shared
    tags:
      - dns
      - public

  - name: google-dns-secondary
    ip_netmask: 8.8.4.4/32
    description: "Google Secondary DNS"
    folder: ngfw-shared
    tags:
      - dns
      - public

  - name: cloudflare-dns
    ip_netmask: 1.1.1.1/32
    description: "Cloudflare DNS"
    folder: ngfw-shared
    tags:
      - dns
      - cloudflare

  - name: internal-services
    ip_range: 192.168.100.1-192.168.100.50
    description: "Internal service IP range"
    folder: ngfw-shared
    tags:
      - internal
      - services