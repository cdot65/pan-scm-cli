# Example address groups for different folders
address_groups:
  # Austin folder examples
  - name: austin-web-servers
    type: static
    description: "All web servers in Austin office"
    folder: Austin
    members:
      - austin-web-server
      - web-server1
      - web-server2
    tags:
      - web
      - austin
      - production

  - name: austin-db-servers
    type: static
    description: "Database servers in Austin"
    folder: Austin
    members:
      - austin-db-server
    tags:
      - database
      - austin

  - name: austin-dynamic-endpoints
    type: dynamic
    description: "Dynamic group for Austin endpoints"
    folder: Austin
    filter: "'austin' and 'endpoint'"
    tags:
      - dynamic
      - austin

  # Texas folder examples
  - name: texas-email-servers
    type: static
    description: "Email infrastructure in Texas"
    folder: Texas
    members:
      - texas-mail-server
    tags:
      - email
      - texas

  - name: texas-branch-networks
    type: static
    description: "All Texas branch networks"
    folder: Texas
    members:
      - texas-branch-network
      - texas-wildcard-subnet
    tags:
      - branch
      - network
      - texas

  - name: texas-dynamic-servers
    type: dynamic
    description: "Dynamic group for Texas servers"
    folder: Texas
    filter: "'texas' and 'server'"
    tags:
      - dynamic
      - texas

  # ngfw-shared folder examples
  - name: public-dns-servers
    type: static
    description: "Public DNS server addresses"
    folder: ngfw-shared
    members:
      - google-dns-primary
      - google-dns-secondary
      - cloudflare-dns
    tags:
      - dns
      - public
      - shared

  - name: all-internal-services
    type: static
    description: "All internal service ranges"
    folder: ngfw-shared
    members:
      - internal-services
    tags:
      - internal
      - services
      - shared

  - name: dynamic-cloud-services
    type: dynamic
    description: "Dynamic group for cloud services"
    folder: ngfw-shared
    filter: "'cloud' and 'service'"
    tags:
      - dynamic
      - cloud
      - shared