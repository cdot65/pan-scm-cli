security_zones:
  - name: zone-internal
    network: {}
    folder: ngfw-shared
    snippet: Auto-VPN-Default-Snippet
  - name: zone-to-hub
    network: {}
    folder: ngfw-shared
    snippet: Auto-VPN-Default-Snippet
  - name: zone-to-branch
    network: {}
    folder: ngfw-shared
    snippet: Auto-VPN-Default-Snippet
  - name: zone-to-pa-hub
    network: {}
    folder: ngfw-shared
    snippet: Auto-VPN-Default-Snippet
  - name: dia
    enable_user_identification: false
    enable_device_identification: false
    network:
      zone_protection_profile: best-practice
      enable_packet_buffer_protection: true
      log_setting: Cortex Data Lake
      layer3:
        - $dia
    folder: ngfw-shared
  - name: mpls
    enable_user_identification: false
    enable_device_identification: false
    network:
      zone_protection_profile: best-practice
      enable_packet_buffer_protection: true
      log_setting: Cortex Data Lake
      layer3:
        - $mpls
    folder: ngfw-shared
  - name: lan
    enable_user_identification: true
    enable_device_identification: false
    network:
      enable_packet_buffer_protection: true
      log_setting: Cortex Data Lake
      layer3:
        - $lan
        - $lo1
    folder: ngfw-shared
  - name: dmz
    enable_user_identification: true
    enable_device_identification: false
    network:
      enable_packet_buffer_protection: false
      log_setting: Cortex Data Lake
      layer3:
        - $dmz
    folder: ngfw-shared
