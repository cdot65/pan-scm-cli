<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7e57c2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5e35b1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded rectangle background -->
  <rect x="8" y="8" width="104" height="104" rx="20" ry="20" fill="url(#g1)" />
  <!-- Terminal window bar -->
  <circle cx="28" cy="28" r="4" fill="#ef5350" opacity="0.9"/>
  <circle cx="40" cy="28" r="4" fill="#ffb300" opacity="0.9"/>
  <circle cx="52" cy="28" r="4" fill="#66bb6a" opacity="0.9"/>
  <!-- Terminal prompt: > -->
  <text x="28" y="62" font-family="monospace" font-size="28" font-weight="bold" fill="#fff" opacity="0.95">&gt;_</text>
  <!-- SCM text -->
  <text x="28" y="92" font-family="monospace" font-size="22" font-weight="bold" fill="#fff" opacity="0.7">SCM</text>
</svg>
