name: PR Tests (Manual Trigger)

on:
  issue_comment:
    types: [created]

jobs:
  check-comment:
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/run-tests')
    outputs:
      should_run: ${{ steps.check-authorization.outputs.result }}
    steps:
      - name: Check if commenter is authorized
        id: check-authorization
        uses: actions/github-script@v6
        with:
          script: |
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login
            });

            const allowedPermissions = ['admin', 'write'];
            const isAuthorized = allowedPermissions.includes(permission.permission);

            return isAuthorized;

      - name: Comment if unauthorized
        if: steps.check-authorization.outputs.result != 'true'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Sorry, only repository administrators and collaborators with write access can trigger tests.'
            });

  run-tests:
    needs: check-comment
    if: needs.check-comment.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - name: Add initial status comment
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '🚀 Running tests as requested...'
          });

    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.8.2
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install dependencies
      run: |
        poetry install

    - name: Setup environment variables for Dynaconf
      run: |
        echo "SCM_CLIENT_ID=${{ secrets.SCM_CLIENT_ID }}" >> $GITHUB_ENV
        echo "SCM_CLIENT_SECRET=${{ secrets.SCM_CLIENT_SECRET }}" >> $GITHUB_ENV
        echo "SCM_TSG_ID=${{ secrets.SCM_TSG_ID }}" >> $GITHUB_ENV
        echo "Set up environment variables for Dynaconf"

    - name: Code Quality Checks
      run: |
        poetry run make lint || { echo "Linting failed"; exit 1; }
        poetry run make ruff || { echo "Formatting check failed"; exit 1; }

    - name: Security Checks with Checkov
      run: |
        poetry run checkov --directory src/ --framework all --quiet

    - name: Post status comment
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const status = '${{ job.status }}' === 'success' ? '✅ Tests passed successfully!' : '❌ Tests failed!';
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: status
          });
