name: Code Quality & Tests

on:
  push:
    branches: [ main, feature/** ]
  # Removed pull_request trigger here as we'll handle it separately

jobs:
  code-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.8.2
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install dependencies
      run: |
        poetry install

    - name: Setup Dynaconf configuration
      run: |
        # Create .secrets.yaml file with GitHub secrets
        cat > .secrets.yaml << EOF
        ---
        default:
          scm_client_id: "${{ secrets.SCM_CLIENT_ID }}"
          scm_client_secret: "${{ secrets.SCM_CLIENT_SECRET }}"
          scm_tsg_id: "${{ secrets.SCM_TSG_ID }}"
        EOF
        echo "Created .secrets.yaml for CI environment"

    - name: Code Quality Checks
      run: |
        poetry run make lint || { echo "Linting failed"; exit 1; }
        poetry run make ruff || { echo "Formatting check failed"; exit 1; }

    - name: Security Checks with Checkov
      run: |
        poetry run checkov --directory src/ --framework all --quiet

